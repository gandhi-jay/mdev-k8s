apiVersion: v1
kind: Pod
metadata:
  name: liveness-example-pod
  labels:
    app: my-web-app
spec:
  containers:
  - name: web-container
    image: nginx:alpine # Using nginx as a quick placeholder
    ports:
    - containerPort: 80
    
    # Define the Liveness Probe here
    livenessProbe:
      httpGet:
        path: /healthz
        port: 80
      initialDelaySeconds: 15  # Wait 15s before the first check
      periodSeconds: 10         # Check every 10 seconds
      timeoutSeconds: 2         # Must respond within 2 seconds
      failureThreshold: 3       # Must fail 3 consecutive times to trigger restart
      successThreshold: 2       # Must pass 1 time to be considered healthy:q
      