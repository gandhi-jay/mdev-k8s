apiVersion: v1
kind: Pod
metadata:
  name: quote-poststart-slow
  labels:
    app.kubernetes.io/name: myapp
spec:
  containers:
    - name: nginx
      image: nginx:alpine
      ports:
        - name: http
          containerPort: 80
      lifecycle:
        postStart:
          exec:
            command:
              - sh
              - -c
              - |
                apk add fortune && apk add curl && \
                sleep 30 && \
                curl -O https://luksa.github.io/kiada/book-quotes.txt && \
                curl -O https://luksa.github.io/kiada/book-quotes.txt.dat && \
                sleep 30 && \
                fortune book-quotes.txt > /usr/share/nginx/html/quote
      resources:
        limits:
          memory: "128Mi"
          cpu: "500m"

