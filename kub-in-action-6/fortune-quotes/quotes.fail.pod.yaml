apiVersion: v1
kind: Pod
metadata:
  name: quote-poststart-fail
  labels:
    app.kubernetes.io/name: myapp
spec:
  containers:
    - name: nginx
      image: nginx:alpine
      ports:
        - name: http
          containerPort: 80
      lifecycle:
        postStart:
          exec:
            command:
              - sh
              - -c
              - "sleep 30; echo 'Emulating a post-start hook failure'; exit 1"
      resources:
        limits:
          memory: "128Mi"
          cpu: "500m"
